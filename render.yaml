# Render Blueprint for PayLoop Campus
# Deploy with 1-click via Render Dashboard -> New -> Blueprint

databases:
  - name: payloop-db
    databaseName: payloop_campus
    user: payloop
    plan: free

services:
  # ---------------------------------------------------------------------------
  # 1. AI Microservice (FastAPI Python)
  # ---------------------------------------------------------------------------
  - type: web
    name: payloop-ai
    runtime: python
    plan: free
    rootDir: payloop-campus/apps/ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: NODE_ENV
        value: production

  # ---------------------------------------------------------------------------
  # 2. Main Backend API (Node.js / Express / Prisma)
  # ---------------------------------------------------------------------------
  - type: web
    name: payloop-api
    runtime: node
    plan: free
    rootDir: payloop-campus
    buildCommand: npm install && npm run build --workspace=apps/api && npx --workspace=apps/api prisma db push && npm run db:seed --workspace=apps/api
    startCommand: npm run start --workspace=apps/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: payloop-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: payloop-ai
          property: host

  # ---------------------------------------------------------------------------
  # 3. Frontend Web App (Next.js)
  # ---------------------------------------------------------------------------
  - type: web
    name: payloop-web
    runtime: node
    plan: free
    rootDir: payloop-campus
    buildCommand: npm install && npm run build --workspace=apps/web
    startCommand: npm run start --workspace=apps/web
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: payloop-api
          property: host
