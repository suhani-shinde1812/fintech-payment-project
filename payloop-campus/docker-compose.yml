version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: payloop_postgres
    environment:
      POSTGRES_USER: payloop
      POSTGRES_PASSWORD: payloop123
      POSTGRES_DB: payloop_campus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payloop -d payloop_campus"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: payloop_api
    environment:
      DATABASE_URL: postgresql://payloop:payloop123@postgres:5432/payloop_campus
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production-32chars}
      JWT_EXPIRES_IN: 7d
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: payloop_ai
    environment:
      AI_API_KEY: ${AI_API_KEY:-}
      PAYLOOP_API_URL: http://api:4000
    ports:
      - "8000:8000"

volumes:
  postgres_data:
